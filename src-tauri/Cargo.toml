[package]
name = "vyder"
version = "0.1.0"
description = "A quiet downloader for social video, on desktop and Android"
authors = ["Vyder contributors"]
repository = "https://github.com/zubair_boii/vyder"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vyder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native folder picker for desktop. Mobile uses the app's private downloads
# folder instead; adding a second dialog runtime just for a path picker would
# make the Android build much heavier.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"
arboard = "3"

# Native bridge used by the Android engine adapter. The Kotlin plugin calls
# these functions to report progress and completion back to the Rust state
# machine that the rest of the app already uses.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
